<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t">
  <title id="t">SoftDeletesFlag by Vortech</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08090a" stop-opacity="0"/>
      <stop offset="1" stop-color="#08090a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="#08090a"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="400" fill="#CF000F"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="128" fill="#8b8c8a" font-size="18" font-weight="600" letter-spacing="4">VORTECH  /  LARAVEL PACKAGE</text>
    <text x="80" y="212" fill="#f4f4f2" font-size="72" font-weight="800" letter-spacing="-2">SoftDeletes<tspan fill="#CF000F">Flag</tspan></text>
    <text x="80" y="266" fill="#8b8c8a" font-size="24">Soft deletes with an indexed boolean,</text>
    <text x="80" y="300" fill="#8b8c8a" font-size="24">not a nullable timestamp.</text>
  </g>

  <!-- table mock -->
  <g transform="translate(790,86)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17">
    <rect width="420" height="228" rx="12" fill="#0c0d0e" stroke="#575856" stroke-opacity=".6"/>
    <rect width="420" height="48" rx="12" fill="#ffffff" fill-opacity=".04"/>
    <text x="24" y="30" fill="#8b8c8a">id</text>
    <text x="100" y="30" fill="#8b8c8a">title</text>
    <text x="270" y="30" fill="#f4f4f2">is_deleted</text>
    <line x1="0" y1="48" x2="420" y2="48" stroke="#575856" stroke-opacity=".6"/>

    <text x="24" y="86" fill="#f4f4f2">1</text>
    <text x="100" y="86" fill="#f4f4f2">Hello</text>
    <rect x="270" y="68" width="84" height="26" rx="13" fill="#f4f4f2" fill-opacity=".08"/>
    <text x="312" text-anchor="middle" y="86" fill="#8b8c8a">false</text>

    <text x="24" y="130" fill="#f4f4f2">2</text>
    <text x="100" y="130" fill="#f4f4f2">Draft</text>
    <rect x="270" y="112" width="84" height="26" rx="13" fill="#f4f4f2" fill-opacity=".08"/>
    <text x="312" text-anchor="middle" y="130" fill="#8b8c8a">false</text>

    <rect x="1" y="150" width="418" height="44" fill="#CF000F" fill-opacity=".14"/>
    <text x="24" y="178" fill="#8b8c8a">3</text>
    <text x="100" y="178" fill="#8b8c8a" text-decoration="line-through">Spam</text>
    <rect x="270" y="160" width="84" height="26" rx="13" fill="#CF000F"/>
    <text x="312" text-anchor="middle" y="178" fill="#ffffff">true</text>

    <text x="24" y="216" fill="#575856" font-size="14">WHERE is_deleted = 0   · indexed</text>
  </g>
</svg>
